name: Deploy PurplePortal

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/purpletech_key
          chmod 600 ~/.ssh/purpletech_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/purpletech_key \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'cd ~/purpletech && ./deploy.sh'
